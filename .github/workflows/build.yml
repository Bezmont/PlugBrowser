# Builds and tests every push and pull request, and publishes a GitHub Release (the zip as the
# download) for:
#
#   - every push to main, i.e. every merged pull request. The version is the series in version.txt
#     plus the next free patch number: 1.0.0, 1.0.1, ... Bump version.txt to start a new series.
#   - a version tag pushed by hand (v1.2.3, or v1.2.3-beta.1 for a pre-release):
#       git tag v1.2.3
#       git push origin v1.2.3
#   - a manual run (Actions > Build > Run workflow) on main, same numbering as a push.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to create the release

# Two merges in quick succession must not both claim the same patch number, so releases run one at a
# time, in order. Pull request builds are not held up by this.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0   # tags are only fetched alongside the history they point at

      # Decides whether this run publishes a release, and under which version.
      - name: Choose version
        id: version
        shell: pwsh
        run: |
          $release = $false
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            $release = $true
          } elseif ('${{ github.ref }}' -eq 'refs/heads/main' -and '${{ github.event_name }}' -ne 'pull_request') {
            $series = (Get-Content version.txt -Raw).Trim()
            if ($series -notmatch '^\d+\.\d+$') { throw "version.txt must hold a series like 1.0, not '$series'." }
            $patches = git tag --list "v$series.*" |
              Where-Object { $_ -match "^v$([regex]::Escape($series))\.(\d+)$" } |
              ForEach-Object { [int]$Matches[1] }
            $next = if ($patches) { ($patches | Measure-Object -Maximum).Maximum + 1 } else { 0 }
            $tag = "v$series.$next"
            $release = $true
          } else {
            $tag = "0.0.0-ci.${{ github.run_number }}"
          }
          Write-Host "Version: $tag (release: $release)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      # NetPlugHost is a submodule, and it in turn pins the Steinberg VST3 SDK. The host compiles only
      # three of the SDK's own submodules, so those are all that is fetched - the SDK's GUI library,
      # docs and tutorials are most of its size and are never used here.
      - name: Fetch NetPlugHost and the VST3 SDK parts it compiles
        shell: pwsh
        run: |
          git submodule update --init external/NetPlugHost
          git -C external/NetPlugHost submodule update --init external/vst3sdk
          git -C external/NetPlugHost/external/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build native parts (NetPlugHost and the native worker)
        shell: pwsh
        run: ./build-native.ps1 -Configuration Release -RebuildNetPlugHost

      - name: Test
        shell: pwsh
        run: dotnet test PlugBrowser.sln -c Release -nologo

      - name: Package
        id: package
        shell: pwsh
        run: |
          $zip = ./publish.ps1 -Version '${{ steps.version.outputs.tag }}' -SkipNative | Select-Object -Last 1
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: PlugBrowser-win-x64
          path: ${{ steps.package.outputs.zip }}

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          # On a main push the tag does not exist yet; the release creates it on the commit built.
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
